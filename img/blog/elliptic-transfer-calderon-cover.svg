 <text x="532" y="195">input</text><text x="850" y="204">flux</text>
 <text x="708" y="242" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="25">q</text>
 <text x="708" y="380" text-anchor="middle" fill="#657780">potentials agree in the boundary collar</text>
</g>
