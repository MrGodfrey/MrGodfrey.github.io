<path d="M290 195L322 158L354 172L386 217L418 180" fill="none" stroke="#142D40" stroke-width="3" stroke-linejoin="round"/>
<path d="M239 190H272" fill="none" stroke="#158A87" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M354 263C354 300 154 300 154 263" fill="none" stroke="#158A87" stroke-width="1.6" marker-end="url(#arrow)"/>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#657780" font-size="12">
 <text x="155" y="129">continuous</text><text x="354" y="129">discrete</text>
 <text x="254" y="319">shifted continuous companion</text>
</g>
<rect x="578" y="129" width="260" height="220" rx="0" fill="#158A87" fill-opacity=".12" stroke="#142D40" stroke-width="2"/>
<rect x="600" y="151" width="216" height="176" fill="#F7F4EA"/>
