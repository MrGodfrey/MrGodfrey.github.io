<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
<title id="title">From a continuous estimate to two boundary patches</title>
<desc id="desc">A smooth curve and a triangular mesh illustrate transfer of estimates. A schematic domain has an input patch on the left and a measurement patch on the right. A shaded collar marks the boundary region where the potentials agree. The drawing is schematic, not a numerical reconstruction.</desc>
<defs>
 <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#158A87" stroke-width="1.4"/></marker>
 <pattern id="mesh" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0 0H40V40H0V0L40 40" fill="none" stroke="#158A87" stroke-opacity=".25" stroke-width="1"/></pattern>
</defs>
<rect width="960" height="480" fill="#F7F4EA"/>
<path d="M64 84H896M64 418H896" stroke="#142D40" stroke-opacity=".16"/>
<g fill="#142D40" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" letter-spacing="2">
 <text x="78" y="63">TRANSFER THE ESTIMATE</text>
 <text x="550" y="63">LOCALIZE THE DATA</text>
</g>
<g fill="none" stroke="#142D40">
 <path d="M88 235H226M88 235V143" stroke-opacity=".3"/>
 <path d="M92 215C115 211 122 151 151 156S184 220 218 178" stroke-width="3" stroke-linecap="round"/>
</g>
