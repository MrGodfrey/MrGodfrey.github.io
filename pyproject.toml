[project]
name = "mrgodfrey-github-io"
version = "0.1.0"
description = "Static academic homepage generator for Yu Wang's academic portfolio."
requires-python = ">=3.9"
dependencies = [
    "jinja2",
    "markdown",
    "pymdown-extensions>=10.21,<11",
    "pyyaml",
    "reportlab>=4.4,<5",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pypdf>=6.19.0",
]
